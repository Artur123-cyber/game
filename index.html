<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header>
    <h1>🎮 GameZone</h1>
    <nav>
        <a href="#">Главная</a>
        <a href="#">Игры</a>
        <a href="#">Новости</a>
        <a href="#">Контакты</a>
    </nav>
</header>

<!-- HERO -->
<section class="hero">
    <h2>Погрузись в мир игр</h2>
    <p>Лучшие игры, новости и новинки индустрии</p>
    <button>Начать</button>
</section>

<!-- GAMES -->
<section class="games">
    <h2>Популярные игры</h2>
 <div class="game-list">
    <div class="game">PUBG Mobile</div>
    <div class="game">Call of Duty</div>
    <div class="game">Warface</div>
    <div class="game">CS:GO</div>
</div>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 GameZone</p>
    <div class="socials">
        <span>🌐</span>
        <span>📱</span>
        <span>💬</span>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
